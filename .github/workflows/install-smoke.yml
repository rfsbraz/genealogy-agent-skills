name: Install smoke

# Installs the plugin from this checkout with each host's own CLI, the way users do,
# and checks that the host lists it at the release version with every skill.
# Free: GitHub-hosted runners, no sign-in and no model calls, so it needs no repository secret.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, gemini, codex, skills]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install with the pinned ${{ matrix.host }} CLI and check it
        run: |
          python scripts/smoke_install.py ${{ matrix.host }} \
            --tools "$RUNNER_TEMP/tools" \
            --log "$RUNNER_TEMP/smoke.log"
      - name: Command output
        if: always()
        run: cat "$RUNNER_TEMP/smoke.log" || true
