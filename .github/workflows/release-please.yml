name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in this workflow because a release created with GITHUB_TOKEN does not
  # start other workflows, so an `on: release` workflow would never fire.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned host validators
        run: scripts/install_host_validators.sh "$RUNNER_TEMP/validators"
      - name: Build and check the release assets
        run: python scripts/package_skills.py --release --out dist > dist-report.json
      - name: Run the host validators on the assets
        run: |
          python scripts/run_host_validators.py dist/release \
            --quick-validate "$RUNNER_TEMP/validators/quick_validate.py" \
            --claude "$RUNNER_TEMP/validators/npm/node_modules/.bin/claude"
      - name: List the assets
        run: |
          ls -l dist/release
          cat dist/release/SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/release/* --clobber
