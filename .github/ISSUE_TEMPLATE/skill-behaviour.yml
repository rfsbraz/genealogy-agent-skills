name: Skill behaviour
description: An agent following a skill did something the skill should prevent or did not do what it should.
body:
  - type: markdown
    attributes:
      value: Use made-up names, dates, places and record references only. Do not paste real family or case data.
  - type: textarea
    id: skill
    attributes:
      label: Which skill and which step?
      description: For example genealogy-repository-discovery, step 6.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What did you ask the agent to do?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What did the agent do?
      description: Quote the relevant part of its answer or actions, with invented details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the skill have led it to do?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Host, model and install method
      description: For example the agent app, the model, and whether you installed with the plugin or install.py.
    validations:
      required: true
